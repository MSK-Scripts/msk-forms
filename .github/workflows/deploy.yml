name: Deploy (Production)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Never run two deploys at once — do NOT cancel a running deploy
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: SSH Deploy → Debian / PM2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://forms.msk-scripts.de

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /opt/msk-forms

            echo "-> Pull latest"
            git fetch --all --prune
            git reset --hard origin/main

            echo "-> Install dependencies (frozen)"
            # Silenced & non-fatal: corepack can't replace a root-owned global
            # pnpm (EACCES); the global pnpm works fine for the install.
            corepack enable >/dev/null 2>&1 || true
            pnpm install --frozen-lockfile --prod=false

            echo "-> Prisma migrate (deploy) + generate"
            pnpm prisma migrate deploy
            pnpm prisma generate

            echo "-> Build (clean .next first to avoid stale standalone chunks)"
            rm -rf apps/web/.next
            pnpm run build

            echo "-> Reload services via PM2 (zero-downtime)"
            pm2 reload ecosystem.config.cjs --update-env

            echo "-> Save PM2 process list"
            pm2 save

            # PM2 reporting "online" only means the process exists, which is not
            # the same as it serving. On 2026-08-17 a bundle missing part of
            # @swc/helpers died on startup without ever binding the port: PM2
            # showed online, this workflow reported success, and the site
            # returned 503 for 40 minutes. Ask the port, not the supervisor.
            echo "-> Health check"
            code=""
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:3008/ || true)
              [ "$code" = "200" ] && { echo "Serving after ${i} attempt(s)."; break; }
              sleep 3
            done
            if [ "$code" != "200" ]; then
              echo "::error::Web process is not serving on :3008 (last status: ${code:-none})"
              pm2 logs msk-forms-web --lines 40 --nostream --err || true
              exit 1
            fi

            echo "Deploy finished"

      - name: Notify Discord (optional)
        if: always()
        continue-on-error: true
        run: |
          STATUS="${{ job.status }}"
          if [ -n "${{ secrets.DEPLOY_DISCORD_WEBHOOK }}" ]; then
            curl -fsSL -H "Content-Type: application/json" \
              -d "{\"content\":\"**MSK Forms** Deploy: \`$STATUS\` (commit ${GITHUB_SHA::7})\"}" \
              "${{ secrets.DEPLOY_DISCORD_WEBHOOK }}"
          fi
