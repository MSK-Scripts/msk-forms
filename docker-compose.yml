# Local dev infrastructure for MSK Forms: Postgres, Redis, MinIO.
# Start: docker compose up -d
services:
  postgres:
    # Same major version as production.
    image: postgres:18
    container_name: msk-forms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: msk
      POSTGRES_PASSWORD: msk
      POSTGRES_DB: msk_forms
    ports:
      - "5432:5432"
    volumes:
      # Since postgres:18 the data lives in a versioned subdirectory, so the
      # volume is mounted one level up. A new volume name keeps an old
      # Postgres 16 volume from being picked up.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msk"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: msk-forms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    # MinIO no longer publishes images; pgsty/minio is a maintained build of
    # the same server with the same CLI and environment variables.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: msk-forms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: msk
      MINIO_ROOT_PASSWORD: msk-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Creates the upload bucket once; the app expects it to exist. Retries until
  # MinIO accepts connections, then exits.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: msk-forms-minio-init
    depends_on:
      - minio
    restart: on-failure
    environment:
      MC_HOST_local: http://msk:msk-secret@minio:9000
    command: ["mb", "--ignore-existing", "local/msk-forms"]

volumes:
  pgdata18:
  redisdata:
  miniodata:
