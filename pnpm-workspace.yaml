packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 no longer runs dependency build scripts by default (supply-chain
# protection). Explicitly allow the trusted ones we rely on.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true

# Security overrides for transitive dependencies (moved here because pnpm no
# longer reads the "pnpm" field in package.json).
overrides:
  "esbuild@<0.28.1": ">=0.28.1"
  "postcss@<8.5.10": ">=8.5.10"
  "undici@<6.27.0": "^6.27.0"
  # GHSA-w5hq-g745-h8pq — uuid missing buffer bounds check in v3/v5/v6 (transitive
  # via exceljs, which only uses v4). Force the patched line; v4 API is unchanged.
  "uuid@<11.1.1": ">=11.1.1"
  # GHSA-4c8g-83qw-93j6 — fast-uri host confusion via failed IDN canonicalization
  # (transitive via ajv, dev-only). Stay on the 3.x line ajv asks for.
  "fast-uri@<3.1.3": ">=3.1.3 <4"
  # GHSA-f88m-g3jw-g9cj — libvips CVEs inherited by sharp. We depend on 0.35.x
  # directly; this only lifts the older copy next pulls in as an optional dep.
  "sharp@<0.35.0": ">=0.35.0"
  # GHSA-3jxr-9vmj-r5cp + GHSA-mh99-v99m-4gvg — brace-expansion DoS via expansion
  # blowup. The second advisory is only fixed in 5.0.8 and flags everything at or
  # below 5.0.7, so the old 1.x/2.x lines stay flagged no matter how far we patch
  # inside them. They only existed because glob@7 (archiver-utils, rimraf@2) and
  # readdir-glob@1 (archiver, via exceljs) pull minimatch 3.x/5.x, so lift
  # minimatch itself to 10 — it depends on brace-expansion ^5, which leaves 5.0.8
  # as the single copy in the tree. Both consumers construct `new Minimatch(...)`
  # rather than calling the export as a function, which is what breaks under 10.
  "minimatch@<10": ">=10 <11"
  "brace-expansion@>=3.0.0 <5.0.8": ">=5.0.8"
