packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 no longer runs dependency build scripts by default (supply-chain
# protection). Explicitly allow the trusted ones we rely on.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true

# Security overrides for transitive dependencies (moved here because pnpm no
# longer reads the "pnpm" field in package.json).
overrides:
  "esbuild@<0.28.1": ">=0.28.1"
  "postcss@<8.5.10": ">=8.5.10"
  # GHSA-8xcm-r25x-g524 / GHSA-m8rv-5g2x-5cg5 / GHSA-v3r7-h72x-cjcm — three undici
  # advisories all first patched in 6.28.0. Transitive via discord.js, which pins
  # the version exactly, so the bot only gets the fix through this override.
  "undici@<6.28.0": "^6.28.0"
  # GHSA-w5hq-g745-h8pq — uuid missing buffer bounds check in v3/v5/v6 (transitive
  # via exceljs, which only uses v4). Force the patched line; v4 API is unchanged.
  "uuid@<11.1.1": ">=11.1.1"
  # GHSA-c96f-x56v-gq3h — find-my-way HTTP/2 DDoS. Arrived with prisma 7.9.0, whose
  # @prisma/dev swapped hono for a pinned find-my-way 9.6.0. Dev-only, patched in
  # 9.7.0; the override is needed because the dependency is pinned exactly.
  "find-my-way@<9.7.0": ">=9.7.0 <10"
  # GHSA-4c8g-83qw-93j6 — fast-uri host confusion via failed IDN canonicalization,
  # then GHSA-7p8r-x3mc-p8w7 on top, which flags everything below 3.1.5
  # (transitive via ajv, dev-only). Stay on the 3.x line ajv asks for.
  "fast-uri@<3.1.5": ">=3.1.5 <4"
  # GHSA-f88m-g3jw-g9cj — libvips CVEs inherited by sharp. We depend on 0.35.x
  # directly; this only lifts the older copy next pulls in as an optional dep.
  "sharp@<0.35.0": ">=0.35.0"
  # GHSA-3jxr-9vmj-r5cp + GHSA-mh99-v99m-4gvg — brace-expansion DoS via expansion
  # blowup. The second advisory is only fixed in 5.0.8 and flags everything at or
  # below 5.0.7, so the old 1.x/2.x lines stay flagged no matter how far we patch
  # inside them. They only existed because glob@7 (archiver-utils, rimraf@2) and
  # readdir-glob@1 (archiver, via exceljs) pull minimatch 3.x/5.x, so lift
  # minimatch itself to 10 — it depends on brace-expansion ^5, which leaves a
  # single copy in the tree. Both consumers construct `new Minimatch(...)` rather
  # than calling the export as a function, which is what breaks under 10.
  #
  # GHSA-rgw5-rvv9-x895 is the third round: unbounded intermediate arrays, which
  # bypasses the CVE-2026-14257 mitigation, fixed in 5.0.9. Note the shape of the
  # bound below — it tracks the newest advisory rather than the range of one
  # specific report, because an override whose floor sits a generation too low
  # looks resolved while leaving the flagged version installed.
  "minimatch@<10": ">=10 <11"
  "brace-expansion@<5.0.9": ">=5.0.9"
  # GHSA-3f6p-5ww8-9rcr — mysql2 complies with an auth switch to
  # mysql_clear_password without checking that TLS is on, so a rogue server can
  # ask for the password in the clear. Dev-only here (the prisma CLI pins it
  # exactly at 3.15.3 for its MySQL datasource support, and this project talks to
  # Postgres), but the exact pin means the fix only lands through an override.
  "mysql2@<3.22.0": ">=3.22.0 <4"
